<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crucivex — Documents</title>
<style>
  :root {
    --bg:#0a0c10; --panel:#11141a; --panel2:#161a22; --line:#222833;
    --text:#c9cfd9; --dim:#79828f; --ok:#3ddc97; --warn:#f0a500; --hi:#00d4ff;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:var(--sans); min-height:100vh; }

  header {
    display:flex; align-items:center; gap:16px; padding:14px 26px;
    border-bottom:1px solid var(--line); background:var(--panel);
    position:sticky; top:0; z-index:5;
  }
  .brand { font-family:var(--mono); font-weight:700; letter-spacing:.22em; font-size:13px; }
  .brand span { color:var(--hi); }
  .who { margin-left:auto; font-family:var(--mono); font-size:10.5px; color:var(--dim); }

  main { max-width:1080px; margin:0 auto; padding:34px 26px 70px; }
  .lede { display:flex; align-items:flex-end; justify-content:space-between; gap:24px; margin-bottom:22px; }
  h1 { font-size:20px; font-weight:600; letter-spacing:-.01em; }
  .lede p { font-size:13px; color:var(--dim); margin-top:6px; max-width:56ch; line-height:1.6; }

  /* ingest */
  .drop {
    border:1px dashed #303a49; border-radius:8px; padding:22px 24px; margin-bottom:26px;
    display:flex; align-items:center; gap:18px; background:var(--panel);
    transition:.16s;
  }
  .drop.over { border-color:var(--hi); background:#0c1a20; }
  .drop-text { flex:1; min-width:0; }
  .drop-text b { display:block; font-size:13.5px; font-weight:600; }
  .drop-text span { font-size:12px; color:var(--dim); line-height:1.55; }
  .btn {
    font-family:var(--mono); font-size:11px; letter-spacing:.08em; white-space:nowrap;
    background:var(--panel2); color:var(--text); border:1px solid var(--line);
    padding:9px 15px; border-radius:5px; cursor:pointer; transition:.15s;
  }
  .btn:hover:not(:disabled) { border-color:#38414f; background:#1b2029; }
  .btn:disabled { opacity:.5; cursor:default; }
  .btn.primary { border-color:#1d4d5e; color:var(--hi); }
  #file { display:none; }
  #ingest-msg { margin:-14px 0 24px; font-size:12px; line-height:1.5; }
  #ingest-msg.err { color:#ff8b84; }
  #ingest-msg.ok { color:var(--ok); }
  #ingest-msg.busy { color:var(--dim); }

  /* cards */
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); gap:14px; }
  .card {
    display:block; text-decoration:none; color:inherit; background:var(--panel);
    border:1px solid var(--line); border-radius:8px; padding:18px 20px; transition:.16s;
  }
  .card:hover { border-color:#38414f; background:#141922; transform:translateY(-1px); }
  .card-top { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .card h2 { font-size:14.5px; font-weight:600; line-height:1.4; }
  .card .src { font-family:var(--mono); font-size:10.5px; color:var(--dim); margin-top:4px; }
  .pill {
    font-family:var(--mono); font-size:9.5px; letter-spacing:.09em; padding:3px 7px;
    border-radius:3px; white-space:nowrap; border:1px solid;
  }
  .pill.ok { color:var(--ok); border-color:#1d4636; background:#0f2019; }
  .pill.bad { color:#ff5f56; border-color:#4a1f1c; background:#1f100f; }
  .pill.part { color:var(--warn, #f0a500); border-color:#4a3a12; background:#211a09; }

  /* A manual that decoded into many procedures: one collapsed block, opened
     on click, so a 210-procedure document does not bury a 3-step one. */
  .group {
    grid-column:1 / -1;              /* a manual is not a card; it spans the grid */
    border:1px solid var(--line); border-radius:8px; background:var(--panel); overflow:hidden;
  }
  .group-head {
    width:100%; display:flex; align-items:center; gap:16px; text-align:left;
    padding:18px 20px; background:none; border:0; color:inherit; cursor:pointer;
    font:inherit;
  }
  .group-head:hover { background:#141922; }
  .group-head > div { flex:1; min-width:0; }
  .group-head h2 { font-size:16px; font-weight:620; }
  .group-head::after {
    content:"▸"; color:var(--dim); font-size:12px; transition:transform .16s;
  }
  .group.open .group-head::after { transform:rotate(90deg); }
  .group-body { display:none; border-top:1px solid var(--line); max-height:60vh; overflow-y:auto; }
  .group.open .group-body { display:block; }
  .row {
    display:flex; align-items:baseline; gap:14px; padding:10px 20px;
    text-decoration:none; color:inherit; border-bottom:1px solid #171c24; font-size:13px;
  }
  .row:last-child { border-bottom:0; }
  .row:hover { background:#141922; }
  .row-title { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row-stats { color:var(--dim); font-family:var(--mono); font-size:10.5px; white-space:nowrap; }
  .row-pill { font-family:var(--mono); font-size:9.5px; color:var(--ok); width:62px; text-align:right; }
  .row.bad .row-pill { color:#ff5f56; }
  .stats { display:flex; gap:20px; margin-top:16px; }
  .stats div span { display:block; font-family:var(--mono); font-size:9.5px; color:var(--dim); letter-spacing:.09em; }
  .stats div b { font-size:17px; font-weight:600; }
  .card-foot {
    margin-top:15px; padding-top:12px; border-top:1px solid #1a2029;
    font-family:var(--mono); font-size:10.5px; color:var(--dim); line-height:1.7;
  }
  .card-foot em { color:var(--text); font-style:normal; }

  .empty {
    border:1px solid var(--line); border-radius:8px; padding:44px 24px; text-align:center;
    color:var(--dim); font-size:13px; line-height:1.7;
  }
</style>
</head>
<body>

<header>
  <div class="brand">CRUCI<span>VEX</span></div>
  <div class="who">TRAINING &middot; LOCAL INSTALL</div>
</header>

<main>
  <div class="lede">
    <div>
      <h1>Documents</h1>
      <p>Technical procedures decoded into worlds you can carry out. Each one is
         checked against its source before it can be opened.</p>
    </div>
  </div>

  <label class="drop" id="drop" for="file">
    <div class="drop-text">
      <b>Add a document</b>
      <span>Drop a service manual here, or choose a file. It is extracted, decoded
            and verified on this machine &mdash; nothing is uploaded anywhere.</span>
    </div>
    <button class="btn primary" id="choose" type="button">Choose PDF</button>
    <input type="file" id="file" accept="application/pdf,.pdf">
  </label>
  <div id="ingest-msg"></div>

  <div class="grid" id="grid"></div>
</main>

<script type="module" src="./library.js"></script>
</body>
</html>
